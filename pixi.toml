[workspace]
authors = ["Ditri Collaku <ditri.collaku@student-cs.fr>"]
channels = ["conda-forge"]
name = "aidams-cement-cvar"
platforms = ["osx-64", "osx-arm64", "linux-64", "win-64"]
version = "0.1.0"

[tasks]
