pyarrow = ">=26.0.1,<27"
scipy = ">=1.18.1,<2"
matplotlib = ">=3.11.2,<4"
plotly = ">=7.1.0,<8"
pandera = ">=0.34.1,<0.35"
yfinance = ">=0.2,<2"
jinja2 = ">=3.1,<4"
